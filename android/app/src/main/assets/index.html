<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>个人周刊阅读器</title><link rel="stylesheet" href="style.css"></head><body><header><button id="back" aria-label="返回">‹</button><a id="home">周刊<span>个人阅读器</span></a><span id="screen-label"></span><button id="settings" aria-label="阅读与登录设置">☷</button></header><div class="publication-bar"><select id="publication"><option value="caixin">财新</option><option value="caijing">财经杂志</option><option value="cbnweek">第一财经</option></select><button id="cache-start">缓存最近100期</button><button id="cache-pause">暂停</button><span id="cache-progress"></span></div><main id="app"></main><div id="toast" role="status"></div><dialog id="account"><div class="dialog-head"><h2>阅读设置</h2><button data-close>×</button></div><p>非官方应用 · 本机个人阅读</p><button id="login">登录当前刊物</button><p class="hint">在当前刊物官网登录。三刊会话留在本机，独立于 Chrome；订阅权限以官网返回为准。</p><label>阅读配色<select id="theme"><option value="paper">纸白</option><option value="sepia">护眼</option><option value="dark">夜间</option><option value="cream">奶油书页</option><option value="parchment">羊皮纸</option><option value="sage">豆沙绿</option><option value="mint">薄荷青</option><option value="mist">雾蓝</option><option value="gray">银灰</option><option value="rose">浅玫瑰</option><option value="lavender">淡紫</option><option value="coffee">深咖</option><option value="forest">松林夜色</option><option value="midnight">午夜蓝</option><option value="ink">墨黑</option></select></label><label>文字大小<input id="font" type="range" min="16" max="28" step="1"></label><p id="cache-size"></p><button id="clear">清除正文及图片缓存</button><button id="logout" class="danger">退出登录并清除缓存</button><p class="hint">只有联网权限。Cookie 和已读内容保存在本机；不要求短信、通讯录或文件访问权限。</p></dialog><dialog id="lightbox"><button data-close>关闭图片 ×</button><div id="zoom-scroll"><img alt="文章配图" id="zoom-image"></div><p id="zoom-caption"></p></dialog><script src="providers.js"></script><script src="app.js"></script></body></html>
